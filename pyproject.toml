[project]
name = "ai-research-studio"
version = "0.1.0"
description = "AI research studio MVP"
authors = [
    {name = "atou"}
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "feedparser (>=6.0.12,<7.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "rich (>=14.1.0,<15.0.0)",
]
scripts = { ai-research-studio = "ai_research_studio.cli:main" }

[tool.poetry]
packages = [{ include = "ai_research_studio", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"