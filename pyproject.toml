[project]
name = "ai-research-studio"
version = "0.1.0"
description = "AI research studio MVP"
authors = [
    {name = "atou"}
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "rich (>=14.3.3,<15.0.0)"
]
[tool.poetry]
packages = [{ include = "ai_research_studio", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)"
]
